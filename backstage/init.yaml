version: 3

vars:
  DEFAULT_PARENT_DIR:
    sh: pwd

tasks:
  install-yarn:
    desc: Install yarn globally via npm (only if missing)
    cmds:
      - |
        if command -v yarn >/dev/null 2>&1; then
          echo "✓ Yarn already installed: $(yarn --version)"
        else
          echo "Yarn not found. Installing yarn globally..."
          npm install --global yarn
          echo "✓ Yarn installed successfully: $(yarn --version)"
        fi

  init:
    desc: Install yarn + scaffold a Backstage app (no nested folder)
    deps:
      - install-yarn
    cmds:
      - |
        echo "📁 Choose the parent directory for the Backstage app"
        echo "Default: {{ .DEFAULT_PARENT_DIR }}"
        echo ""

        PARENT_DIR=$(gum input --placeholder "{{ .DEFAULT_PARENT_DIR }}")
        PARENT_DIR="$(echo "$PARENT_DIR" | xargs)"

        if [ -z "$PARENT_DIR" ]; then
          PARENT_DIR="{{ .DEFAULT_PARENT_DIR }}"
        fi

        echo ""
        echo "🧩 Enter the Backstage app folder name (will be created inside parent dir)"
        echo ""

        APP_NAME=$(gum input --placeholder "sthings-backstage")
        APP_NAME="$(echo "$APP_NAME" | xargs)"

        if [ -z "$APP_NAME" ]; then
          echo "❌ App name is required"
          exit 1
        fi

        TARGET_DIR="$PARENT_DIR/$APP_NAME"

        echo ""
        echo "Creating Backstage app here:"
        echo "  $TARGET_DIR"
        echo ""

        mkdir -p "$PARENT_DIR"
        cd "$PARENT_DIR"

        # This prevents nesting (create-app will create APP_NAME itself)
        npx @backstage/create-app --path "$APP_NAME"

      - |
        echo ""
        echo "✓ Backstage application scaffolded successfully"

---
# chezmoi-managed secrets (~/.secrets.d, SOPS-encrypted dotenv files): bring a
# change made in $HOME back into the chezmoi source and push it. Meant for the
# global Taskfile (included remotely as `secrets`), works from any directory:
#
#   task -g secrets:status   # which secret files differ ($HOME / chezmoi source / git)
#   task -g secrets:push     # pick changed files (gum), re-add, commit, push
#
# The usual way to change a secret is still `sops ~/.secrets.d/<loc>/<tool>.env`
# (or `t secrets:edit`); this covers the case where the file in $HOME was edited
# and the chezmoi source / dotfiles repo is now behind.
#
# Every file is checked with `sops filestatus` before it is re-added and again
# in the source before it is committed: a file that is not SOPS-encrypted is
# refused, so a plaintext edit never reaches git.
#
# Needs: chezmoi, sops, gum, git.
version: 3

vars:
  SECRETS_DIR: '{{.SECRETS_DIR | default ".secrets.d"}}'

tasks:
  status:
    desc: "secrets: show secret files that differ between $HOME, the chezmoi source and git"
    silent: true
    preconditions:
      - sh: command -v chezmoi && command -v git
        msg: "braucht chezmoi, git"
    cmds:
      - |
        set -euo pipefail
        target="$HOME/{{.SECRETS_DIR}}"
        src=$(chezmoi source-path "$target")
        repo=$(git -C "$src" rev-parse --show-toplevel)

        gum style --bold "chezmoi (\$HOME vs source)"
        chezmoi status "$target" || true

        gum style --bold "git (source repo, uncommitted)"
        git -C "$repo" status --short -- "$src"

        gum style --bold "git (commits not pushed)"
        git -C "$repo" fetch --quiet origin 2>/dev/null || echo "(fetch failed -- showing the last known remote state)"
        git -C "$repo" log --oneline '@{upstream}..HEAD' -- "$src" 2>/dev/null || true

  push:
    desc: "secrets: pick changed ~/.secrets.d files (gum), chezmoi re-add, commit + push the dotfiles repo"
    interactive: true
    silent: true
    preconditions:
      - sh: command -v chezmoi && command -v sops && command -v gum && command -v git
        msg: "braucht chezmoi, sops, gum, git"
    cmds:
      - |
        set -euo pipefail
        target="$HOME/{{.SECRETS_DIR}}"
        src=$(chezmoi source-path "$target")
        repo=$(git -C "$src" rev-parse --show-toplevel)

        is_encrypted() { sops filestatus "$1" 2>/dev/null | grep -q '"encrypted":true'; }

        # 1. Files in $HOME that differ from the chezmoi source (paths relative
        #    to $HOME, e.g. .secrets.d/labda/vsphere.env); directories left out.
        changed=$(chezmoi status "$target" | awk '{print $NF}' | while read -r f; do
          [ -f "$HOME/$f" ] && echo "$f"; done || true)

        if [ -n "$changed" ]; then
          picked=$(echo "$changed" | gum choose --no-limit --selected='*' \
            --header "RE-ADD TO CHEZMOI (space = toggle, enter = ok)") || true
          [ -n "$picked" ] || { echo "nothing picked"; exit 0; }

          while read -r f; do
            if ! is_encrypted "$HOME/$f"; then
              gum style --foreground 196 "REFUSED: ~/$f is not SOPS-encrypted -- encrypt it first (sops -e -i ~/$f)"
              exit 1
            fi
          done <<< "$picked"

          while read -r f; do
            chezmoi re-add "$HOME/$f"
            echo "re-added ~/$f"
          done <<< "$picked"
        else
          echo "chezmoi: ~/{{.SECRETS_DIR}} matches the source"
        fi

        # 2. Commit whatever is uncommitted under the secrets source dir (also
        #    changes made in the source directly, e.g. by `t secrets:edit`).
        dirty=$(git -C "$repo" status --porcelain --untracked-files=all -- "$src" | awk '{print $NF}')
        if [ -n "$dirty" ]; then
          while read -r p; do
            [ -f "$repo/$p" ] || continue   # deleted file: nothing to check
            if ! is_encrypted "$repo/$p"; then
              gum style --foreground 196 "REFUSED: $p in the chezmoi source is not SOPS-encrypted"
              exit 1
            fi
          done <<< "$dirty"

          git -C "$repo" status --short -- "$src"
          names=$(echo "$dirty" | sed -E 's#^[^/]+/##; s#\.env$##' | paste -sd, - | sed 's/,/, /g')
          msg=$(gum input --header "COMMIT MESSAGE" --width 100 --value "secrets: update $names")
          [ -n "$msg" ] || { echo "no message -- aborted"; exit 1; }
          gum confirm "Commit these files?" || { echo "aborted"; exit 1; }
          git -C "$repo" add -A -- "$src"
          git -C "$repo" commit --quiet -m "$msg" -- "$src"
          git -C "$repo" log --oneline -1
        else
          echo "git: nothing to commit under $(basename "$src")"
        fi

        # 3. Push if the branch is ahead of its upstream.
        git -C "$repo" fetch --quiet origin || true
        ahead=$(git -C "$repo" rev-list --count '@{upstream}..HEAD' 2>/dev/null || echo 0)
        if [ "$ahead" -gt 0 ]; then
          git -C "$repo" log --oneline '@{upstream}..HEAD'
          gum confirm "Push $ahead commit(s) to $(git -C "$repo" rev-parse --abbrev-ref '@{upstream}')?" \
            || { echo "not pushed"; exit 0; }
          git -C "$repo" push --quiet
          echo "pushed"
        else
          echo "git: nothing to push"
        fi
